# Cloudflare Workers Static Assets — DesktopFlow ERP legal site
# Plain HTML/CSS only. No Worker starter script.

name = "desktopflow-legal"
compatibility_date = "2026-09-25"
workers_dev = true

# Assets-only: serves public/index.html and public/<page>/index.html
# Do NOT set `main` (avoids Hello World Worker).
# Do NOT ship a public/_redirects that conflicts with html_handling.
[assets]
directory = "./public"
# Extensionless folder routes return 200:
#   /privacy-policy  -> public/privacy-policy/index.html
#   /terms           -> public/terms/index.html
#   /data-deletion   -> public/data-deletion/index.html
html_handling = "drop-trailing-slash"
not_found_handling = "404-page"
